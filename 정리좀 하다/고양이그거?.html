<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{font-size: 48px;
        width: 240px;
        height: 100px;
        border: 6px solid black;}
    </style>
</head>
<body>
    <p style="overflow: hidden;">오늘쌰걀금요일인데</p>
    <br><br><br><br>
    <p style="overflow: visible;">짜증나고조끄튼과제내주시면</p>
    <br><br><br><br>
    <p style="overflow: scroll;">대절단가로조져서죽여버리겠습니다</p>
</body>
</html>
