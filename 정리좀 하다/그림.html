<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            background: yellow;
            width: 200px;
            height: 60px;
            padding: 10px;
            border: 20px solid cyan;
        }
        #round {border-image: url("그림.pnd") 30 round}
        #repeat {border-image: url("그림.pnd") 30 repeat}
        #stretch {border-image: url("그림.pnd") 30 stretch}
    </style>
</head>
<body>
    <p>20x20크기 p블록</p>
    <p id="round"></p>
    <p id="'repeat"></p>
    <p id="stretch"></p>
</body>
</html>
