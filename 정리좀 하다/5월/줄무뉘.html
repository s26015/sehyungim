<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px dashed blue;
            border-collapse: collapse;
        }
        td,th{
            border: dotted green;
        }
        tfoot th{
            border-bottom: 3px solid black;
        }
        tbody tr:nth-child(even){
            background: navy;
        }
        tbody tr:nth-child(odd){
            background:yellow;
        }
    </style>
</head>
<body>
    <h2>1학기성적</h2>
    <hr>
    <table>
        <thead>
            <tr>
                <th>이름</th>
                <th>html</th>
                <th>CSS</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th>합</th>
                <th>70</th>
                <th>46</th>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <td>a</td>
                <td>23</td>
                <td>34</td>
            </tr>
            <tr>
                <td>55</td>
                <td>62</td>
                <td>2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
