<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes tca {
            0%{color: blue;}
            20%{color: yellow;}
            40%{color: red;}
            60%{color: green;}
            80%{color: brown;}
            100%{color: blue;}
           
        }
        span{
            animation-name: tca;
            animation-duration: 5s;
            animation-iteration-count: infinite; 
        }
    </style>
</head>
<body>
    <p><span>span</span>란 ㅔㄱ스</p>
</body>
</html>
