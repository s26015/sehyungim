<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>학번이름</title>
        <style>
            h3 {text-align: center;}
            span {background-color: rgb(247, 162, 247);}
            hr {border: 5px rgb(142, 53, 142) solid ;}
            article {                
                background:rgb(255, 233, 166);
                padding : 20px;
                border-radius: 20px 20px;
                margin-left: 30px;
                margin-right: 30px;
                margin-top: 30px;}
        </style>
    </head>
    <body>
        <header>
            <h3><span>아기공룡둘리</span></h3>
            <hr>
        </header>
        <section>
            <article>
                
                1983년 4월호 부터 육영 재단에서 발행하던 <br>
                월간 만화잡지 '보물섬'에 1983년 4월 23일부터 <br>
                1993년 8월 8일까지 10년간 연재되었다. <br>
                항상잡지의 첫 번째나 두 번째에 실렸다. <br>
                둘리가 워낙 인기 만화였기 때문에, <br>
                보물섬에서 매달 추첨하여 증정하는 선물 중엔 둘리 인형이 포함되어 있었다.
            </article>
        </section>
    </body>
</html>
