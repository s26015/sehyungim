<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>학번이름</title>
        <style>
            header h3{background-color: rgb(255, 227, 117);}
            hr {border: 5px dotted pink;}
            .A {text-decoration: overline;}
            .B {color : rgb(212, 0, 255); 
                font-size: 2em;
            }
        </style>
    </head>
    <body>
        <header>
            <h3>네이버</h3>
        </header>
        <section>
            <article>
                <hr>
                <p class="A">1998년 1월 네이버의 시험 서비스가 시작되었다.</p>
                <p>네이버는 '항해하다'라는 뜻의 'Navigate'와 '-하는 사람'의 뜻을 가진 접미사</p>
                <p><del>'-er'이 만나 탄생한 이름이다. 이는 '정보의 바다라고 일컫는 인터넷을 항해하는 사람'을 의미하였다.</del></p>
                <p>1999년 6월 네이버컴(주)가 설립되었다.</p>
            </article>
            <article>
                <h3 class="B">현재 회사의 자산 규모는 1200<sup>3</sup>억원 규모이다.</h3>
            </article>
        </section>
        <footer>
            &copy;gsm highschool 2025 sep
        </footer>
    </body>
</html>
